<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Git Panel - Sidebar Panel</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
--bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a24;
--text:#e0e0e0;--text2:#a0a0b0;--text3:#666;
--border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.1);
--accent:#7c3aed;--accent2:#3b82f6;--hover:rgba(124,58,237,0.1);
--diff-added:rgba(34,197,94,0.15);--diff-removed:rgba(239,68,68,0.15);
--diff-added-text:#22c55e;--diff-removed-text:#ef4444;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;height:100vh;display:flex;}
.panel{width:280px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;overflow:hidden;}
.header{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.header h3{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--text2);}
.refresh-btn{background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px;padding:4px;}
.refresh-btn:hover{color:var(--text);}
.branch-info{padding:8px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;font-size:12px;}
.branch-icon{color:var(--accent2);font-size:11px;}
.branch-name{color:var(--accent2);font-weight:500;}
.change-count{color:var(--text3);margin-left:auto;font-size:11px;}
.search-box{padding:8px 14px;border-bottom:1px solid var(--border);}
.search-box input{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:4px;padding:6px 8px;color:var(--text);font-size:12px;outline:none;}
.search-box input::placeholder{color:var(--text3);}
.search-box input:focus{border-color:var(--accent);}
.mode-select{display:flex;gap:2px;padding:6px 14px;border-bottom:1px solid var(--border);}
.mode-btn{flex:1;padding:4px;background:var(--bg3);border:1px solid var(--border);color:var(--text3);font-size:10px;cursor:pointer;text-align:center;}
.mode-btn:first-child{border-radius:3px 0 0 3px;}
.mode-btn:last-child{border-radius:0 3px 3px 0;}
.mode-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.file-list{flex:1;overflow-y:auto;padding:6px 0;}
.file-item{display:flex;align-items:center;padding:4px 14px;cursor:pointer;font-size:12px;gap:6px;}
.file-item:hover{background:var(--hover);}
.file-status{width:16px;height:16px;border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;}
.file-status.modified{background:var(--hover);color:var(--accent);}
.file-status.added{background:var(--diff-added);color:var(--diff-added-text);}
.file-status.deleted{background:var(--diff-removed);color:var(--diff-removed-text);}
.file-name{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.file-path{color:var(--text3);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.diff-hint{margin-left:auto;color:var(--text3);font-size:10px;flex-shrink:0;}
.actions{border-top:1px solid var(--border);padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:4px;}
.action-btn{padding:6px;background:var(--bg3);border:1px solid var(--border2);border-radius:4px;color:var(--text2);font-size:11px;cursor:pointer;text-align:center;}
.action-btn:hover{background:var(--hover);color:var(--text);}
.action-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.action-btn.primary:hover{opacity:0.9;}
.main-area{flex:1;background:var(--bg);padding:16px;display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:13px;}
</style>
</head>
<body>
<div class="panel">
  <div class="header">
    <h3>Source Control</h3>
    <button class="refresh-btn">&#8635;</button>
  </div>
  <div class="branch-info">
    <span class="branch-icon">&#9670;</span>
    <span class="branch-name">master</span>
    <span class="change-count">3 changes</span>
  </div>
  <div class="search-box">
    <input type="text" placeholder="Search commits...">
  </div>
  <div class="mode-select">
    <button class="mode-btn active">Message</button>
    <button class="mode-btn">Author</button>
    <button class="mode-btn">File</button>
    <button class="mode-btn">Content</button>
  </div>
  <div class="file-list">
    <div class="file-item">
      <span class="file-status modified">M</span>
      <div><div class="file-name">App.jsx</div><div class="file-path">src/components/</div></div>
      <span class="diff-hint">+12 -4</span>
    </div>
    <div class="file-item">
      <span class="file-status modified">M</span>
      <div><div class="file-name">utils.js</div><div class="file-path">src/lib/</div></div>
      <span class="diff-hint">+3 -1</span>
    </div>
    <div class="file-item">
      <span class="file-status added">A</span>
      <div><div class="file-name">README.md</div><div class="file-path">./</div></div>
      <span class="diff-hint">+45 -0</span>
    </div>
  </div>
  <div class="actions">
    <button class="action-btn primary">Commit</button>
    <button class="action-btn">Branches</button>
    <button class="action-btn">History</button>
    <button class="action-btn">Graph</button>
    <button class="action-btn" style="grid-column:span 2;">Sync</button>
  </div>
</div>
<div class="main-area">Select a file to view changes</div>
</body>
</html>
