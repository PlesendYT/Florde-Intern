<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings - Top Tabs</title>
<style>
  :root {
    --bg: #0a0a0f; --bg2: #12121a; --bg3: #1a1a24;
    --text: #e0e0e0; --text2: #a0a0b0; --text3: #666;
    --border: rgba(255,255,255,0.06); --border2: rgba(255,255,255,0.1);
    --accent: #7c3aed; --accent2: #3b82f6; --hover: rgba(124,58,237,0.1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
  .top-bar { padding: 16px 24px 0; background: var(--bg2); border-bottom: 1px solid var(--border); }
  .title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .title-row h1 { font-size: 18px; font-weight: 600; }
  .close { background: none; border: none; color: var(--text3); font-size: 18px; cursor: pointer; padding: 4px 10px; border-radius: 6px; }
  .close:hover { background: var(--hover); color: var(--text); }
  .tabs { display: flex; gap: 0; }
  .tab { padding: 10px 18px; font-size: 13px; color: var(--text3); cursor: pointer; border: none; background: none; border-bottom: 2px solid transparent; transition: all 0.2s; }
  .tab:hover { color: var(--text2); background: var(--hover); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .body { flex: 1; overflow-y: auto; padding: 24px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 18px; }
  .card h3 { font-size: 13px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 14px; }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; }
  .row + .row { border-top: 1px solid var(--border); }
  .row label { font-size: 14px; }
  .row small { color: var(--text3); font-size: 12px; }
  .toggle { width: 38px; height: 20px; background: var(--bg3); border-radius: 10px; position: relative; cursor: pointer; border: 1px solid var(--border2); }
  .toggle.on { background: var(--accent); border-color: var(--accent); }
  .toggle::after { content: ''; width: 14px; height: 14px; border-radius: 50%; background: white; position: absolute; top: 2px; left: 2px; transition: transform 0.2s; }
  .toggle.on::after { transform: translateX(18px); }
  select, input[type="text"], input[type="number"], input[type="password"] { background: var(--bg3); border: 1px solid var(--border2); color: var(--text); padding: 7px 12px; border-radius: 6px; font-size: 13px; outline: none; width: 100%; }
  select { width: auto; cursor: pointer; }
  select:focus, input:focus { border-color: var(--accent); }
  .field { margin-bottom: 12px; }
  .field:last-child { margin-bottom: 0; }
  .field label { display: block; font-size: 12px; color: var(--text3); margin-bottom: 4px; }
  textarea { width: 100%; background: var(--bg3); border: 1px solid var(--border2); color: var(--text); padding: 10px; border-radius: 6px; font-size: 13px; font-family: inherit; resize: vertical; min-height: 70px; outline: none; }
  textarea:focus { border-color: var(--accent); }
  .checks { display: flex; flex-direction: column; gap: 8px; }
  .checks label { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text2); cursor: pointer; }
  .checks input { accent-color: var(--accent); }
</style>
</head>
<body>
<div class="top-bar">
  <div class="title-row">
    <h1>Settings</h1>
    <button class="close">&times;</button>
  </div>
  <div class="tabs">
    <button class="tab active">General</button>
    <button class="tab">Keybinds</button>
    <button class="tab">AI Providers</button>
    <button class="tab">Connected Apps</button>
    <button class="tab">Appearance</button>
    <button class="tab">Security</button>
    <button class="tab">API Keys</button>
    <button class="tab">MCP Servers</button>
  </div>
</div>
<div class="body">
  <div class="grid-2">
    <div class="card">
      <h3>Language & Region</h3>
      <div class="field">
        <label>Display Language</label>
        <select><option>English</option><option>Deutsch</option></select>
      </div>
    </div>
    <div class="card">
      <h3>Timeout</h3>
      <div class="field">
        <label>Request timeout (seconds)</label>
        <input type="number" value="30">
      </div>
    </div>
  </div>
  <div class="card" style="margin-top:16px">
    <h3>Behavior</h3>
    <div class="row"><div><label>See Thoughts</label><br><small>Show AI reasoning process</small></div><div class="toggle on"></div></div>
    <div class="row"><div><label>Instant Mode</label><br><small>Faster response times</small></div><div class="toggle"></div></div>
    <div class="row"><div><label>Detailed Activity</label><br><small>Extended activity logging</small></div><div class="toggle on"></div></div>
    <div class="row"><div><label>Auto-start</label><br><small>Launch on system startup</small></div><div class="toggle"></div></div>
    <div class="row"><div><label>Offline Mode</label><br><small>Work without internet</small></div><div class="toggle"></div></div>
  </div>
  <div class="card" style="margin-top:16px">
    <h3>Custom Instructions</h3>
    <textarea placeholder="Enter custom instructions...">Always respond in a professional tone. Follow TypeScript best practices.</textarea>
  </div>
  <div class="card" style="margin-top:16px">
    <h3>Auto Accept Exceptions</h3>
    <div class="checks">
      <label><input type="checkbox" checked> File changes</label>
      <label><input type="checkbox"> Shell commands</label>
      <label><input type="checkbox" checked> Package installs</label>
      <label><input type="checkbox"> Git operations</label>
    </div>
  </div>
</div>
</body>
</html>
