# Release-Pipeline: bei jedem Push auf main bauen, und NUR wenn alle
# Builds erfolgreich waren, ein GitHub Release mit genau diesen 7 Assets
# erstellen (Version jeweils aus App/config.json, der einzigen Quelle):
#   Florde-[Version]-x86_64.AppImage
#   Florde-[Version]-amd64.deb
#   Florde-[Version]-arm64.deb
#   Florde-[Version]-x86_64-Setup.exe
#   Florde-[Version]-arm64-Setup.exe
#   Florde-[Version]-arm64.dmg
#   Florde-[Version]-x64.dmg
# Jede Plattform baut auf nativem Runner (native Module lassen sich nicht
# cross-kompilieren). Fehlt eine Datei oder ein Build, schlägt der Workflow
# fehl und es entsteht KEIN (unvollständiger) Release.
# Am Ende läuft IMMER (Erfolg wie Fehler) der cleanup-Job: er löscht nur die
# temporären Workflow-Artifacts und den Actions-Cache dieses Laufs.
# Releases und Release-Assets werden niemals angefasst.
name: Build installers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-win-x64:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: App
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: App/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build:win -- --publish never
      - name: Normalize asset name
        run: |
          VER=$(node -p "require('./config.json').version")
          # Nur hier ist mv nötig: Windows kennt kein x86_64-Mapping im
          # artifactName (NSIS liefert Florde-Setup-<V>.exe).
          mv "build-output/Florde-Setup-${VER}.exe" "build-output/Florde-${VER}-x86_64-Setup.exe"
          ls "build-output/Florde-${VER}-x86_64-Setup.exe"
      - uses: actions/upload-artifact@v5
        with:
          name: florde-win-x64
          path: App/build-output/Florde-*-x86_64-Setup.exe
          if-no-files-found: error

  build-win-arm64:
    runs-on: windows-11-arm
    defaults:
      run:
        working-directory: App
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: App/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build:win -- --publish never
      - name: Normalize asset name
        run: |
          VER=$(node -p "require('./config.json').version")
          # Siehe build-win-x64: arch-Ergänzung nur per mv möglich.
          mv "build-output/Florde-Setup-${VER}.exe" "build-output/Florde-${VER}-arm64-Setup.exe"
          ls "build-output/Florde-${VER}-arm64-Setup.exe"
      - uses: actions/upload-artifact@v5
        with:
          name: florde-win-arm64
          path: App/build-output/Florde-*-arm64-Setup.exe
          if-no-files-found: error

  build-linux-x64:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: App
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: App/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build:linux -- AppImage deb --publish never
      - name: Verify asset names
        # Kein mv nötig: electron-builder liefert direkt
        # Florde-<V>-x86_64.AppImage und Florde-<V>-amd64.deb
        # (arch-Mapping je Target, lokal verifiziert).
        run: |
          VER=$(node -p "require('./config.json').version")
          ls "build-output/Florde-${VER}-x86_64.AppImage" "build-output/Florde-${VER}-amd64.deb"
      - uses: actions/upload-artifact@v5
        with:
          name: florde-linux-x64
          path: |
            App/build-output/Florde-*-x86_64.AppImage
            App/build-output/Florde-*-amd64.deb
          if-no-files-found: error

  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: App
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: App/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build:linux -- deb --publish never
      - name: Verify asset name
        run: |
          VER=$(node -p "require('./config.json').version")
          ls "build-output/Florde-${VER}-arm64.deb"
      - uses: actions/upload-artifact@v5
        with:
          name: florde-linux-arm64
          path: App/build-output/Florde-*-arm64.deb
          if-no-files-found: error

  build-mac-x64:
    runs-on: macos-15-intel
    defaults:
      run:
        working-directory: App
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: App/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build:mac -- dmg --publish never
      - name: Verify asset name
        run: |
          VER=$(node -p "require('./config.json').version")
          ls "build-output/Florde-${VER}-x64.dmg"
      - uses: actions/upload-artifact@v5
        with:
          name: florde-mac-x64
          path: App/build-output/Florde-*-x64.dmg
          if-no-files-found: error

  build-mac-arm64:
    runs-on: macos-15
    defaults:
      run:
        working-directory: App
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: App/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build:mac -- dmg --publish never
      - name: Verify asset name
        run: |
          VER=$(node -p "require('./config.json').version")
          ls "build-output/Florde-${VER}-arm64.dmg"
      - uses: actions/upload-artifact@v5
        with:
          name: florde-mac-arm64
          path: App/build-output/Florde-*-arm64.dmg
          if-no-files-found: error

  release:
    # Läuft nur, wenn ALLE sechs Builds erfolgreich waren.
    needs: [build-win-x64, build-win-arm64, build-linux-x64, build-linux-arm64, build-mac-x64, build-mac-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: florde-*
          merge-multiple: true
          path: dist
      - name: Verify all 7 release assets exist
        run: |
          VER=$(node -p "require('./App/config.json').version")
          echo "Erwartete Version: $VER"
          cd dist
          ls -la
          MISSING=0
          for f in \
            "Florde-${VER}-x86_64.AppImage" \
            "Florde-${VER}-amd64.deb" \
            "Florde-${VER}-arm64.deb" \
            "Florde-${VER}-x86_64-Setup.exe" \
            "Florde-${VER}-arm64-Setup.exe" \
            "Florde-${VER}-arm64.dmg" \
            "Florde-${VER}-x64.dmg"; do
            if [ ! -f "$f" ]; then echo "MISSING: $f"; MISSING=1; fi
          done
          if [ "$MISSING" -ne 0 ]; then echo "Release abgebrochen: Assets unvollständig."; exit 1; fi
          echo "Alle 7 Assets vorhanden."
          echo "VER=$VER" >> "$GITHUB_ENV"
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          # VER kommt aus App/config.json (einzige Quelle), via $GITHUB_ENV.
          TAG="v${VER}"
          FILES="Florde-${VER}-x86_64.AppImage Florde-${VER}-amd64.deb Florde-${VER}-arm64.deb Florde-${VER}-x86_64-Setup.exe Florde-${VER}-arm64-Setup.exe Florde-${VER}-arm64.dmg Florde-${VER}-x64.dmg"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG existiert — Assets werden ersetzt."
            # shellcheck disable=SC2086
            gh release upload "$TAG" --clobber $FILES
          else
            echo "Release $TAG wird erstellt."
            # shellcheck disable=SC2086
            gh release create "$TAG" $FILES --title "Florde v${VER}" --generate-notes
          fi

  cleanup:
    # Letzter Schritt: läuft IMMER — nach erfolgreichem Release ebenso wie
    # bei fehlgeschlagenen Builds. Löscht ausschließlich temporäre
    # Workflow-Artifacts und den Actions-Cache; Releases/Assets bleiben
    # unangetastet (kein gh-release-Befehl in diesem Job).
    needs: [build-win-x64, build-win-arm64, build-linux-x64, build-linux-arm64, build-mac-x64, build-mac-arm64, release]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete workflow artifacts of this run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          RUN_ID="${{ github.run_id }}"
          FAILED=0
          for id in $(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts?per_page=100" --jq '.artifacts[].id'); do
            if gh api --method DELETE "repos/$REPO/actions/artifacts/$id" >/dev/null 2>&1; then
              echo "Artifact gelöscht: $id"
            else
              echo "::warning::Artifact $id konnte nicht gelöscht werden"
              FAILED=1
            fi
          done
          echo "Artifacts bereinigt."
          exit $FAILED
      - name: Delete Actions cache
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          REF="${{ github.ref }}"
          FAILED=0
          for key in $(gh api "repos/$REPO/actions/caches?ref=$REF&per_page=100" --jq '.actions_caches[].key' | sort -u); do
            if gh cache delete "$key" --ref "$REF" >/dev/null 2>&1; then
              echo "Cache gelöscht: $key"
            else
              echo "::warning::Cache $key konnte nicht gelöscht werden"
              FAILED=1
            fi
          done
          echo "Cache bereinigt."
          exit $FAILED
